# Copy to config.yaml next to your .env. Values like ${NAME} come from the environment.
discord:
  token: ${DISCORD_TOKEN}
# Signs button, select and modal custom IDs; needed when a loaded module has buttons, selects or modals (example-notes does)
# and for the menus and buttons of /help (without it /help shows pages only).
# At least 32 characters, e.g. `openssl rand -base64 32`. Changing it breaks every button and modal already posted.
# Remove this section if no loaded module has buttons, selects or modals and you can do without them in /help.
interactions:
  secret: ${INTERACTION_SECRET}
database:
  # The app role is subject to row-level security and switches to one role per module; the admin role owns the schema,
  # runs migrations and creates those roles (it needs CREATEROLE).
  appUrl: ${DATABASE_APP_URL}
  adminUrl: ${DATABASE_ADMIN_URL}
# One key per module package to load; an empty value loads the module with its defaults.
modules:
  "@bronto/example-notes": {}
  # "@bronto/autodelete": {}   # needs the Message Content and Server Members intents; see modules/autodelete/README.md
  # "@bronto/templates": {}   # needs the Message Content intent and a Community server; see modules/templates/README.md
  # "@bronto/forms": {}   # needs @bronto/templates and the Message Content intent; see modules/forms/README.md
  # "@bronto/sticky": {}   # needs @bronto/templates (which needs the Message Content intent); see modules/sticky/README.md
