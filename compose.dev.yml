# Local Postgres for development and manual testing; not for production.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: bot_admin
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: bronto
      BOT_APP_PASSWORD: dev
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d:ro
      - dev-pgdata:/var/lib/postgresql

volumes:
  dev-pgdata:
